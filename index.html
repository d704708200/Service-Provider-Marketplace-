<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * {
      font-family: 'Inter', sans-serif;
    }

    /* ── Animated Background ─────────────────────── */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 12s ease-in-out infinite alternate;
    }

    .bg-orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
      top: -10%; left: -5%;
      animation-duration: 14s;
    }

    .bg-orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
      bottom: -10%; right: -5%;
      animation-duration: 10s;
    }

    .bg-orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #ec4899 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 16s;
    }

    @keyframes float {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(40px, -30px) scale(1.1); }
      66%  { transform: translate(-20px, 25px) scale(0.95); }
      100% { transform: translate(30px, -10px) scale(1.05); }
    }

    /* ── Glass Card ──────────────────────────────── */
    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* ── Input Shimmer on focus ──────────────────── */
    .input-glow {
      transition: box-shadow 0.3s ease;
    }
    .input-glow:focus-visible {
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.35);
    }

    /* ── Password toggle icon animation ─────────── */
    .eye-icon {
      transition: all 0.3s ease;
    }
    .eye-icon:hover {
      transform: scale(1.15);
    }

    /* ── Success animation ───────────────────────── */
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .animate-pop {
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* ── Password strength bar transition ───────── */
    .strength-bar-fill {
      transition: width 0.3s ease, background 0.3s ease;
    }

    /* ── Shake animation for error ───────────────── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%     { transform: translateX(-6px); }
      40%     { transform: translateX(6px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-950 overflow-hidden">

  <!-- Animated Background Orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <!-- Particle dots background -->
  <div id="particles" class="fixed inset-0 pointer-events-none overflow-hidden"></div>

  <!-- ── Login Card Container ────────────────────── -->
  <main class="relative z-10 w-full max-w-md px-4">

    <!-- Logo / Header -->
    <header class="text-center mb-8 animate-pop" style="animation-delay: 0.2s;">
      <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-indigo-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v5m-3.579 9.382a1.5 1.5 0 00-.579-4.751C5.57 10.926 3 13.555 3 16c0 1.555.397 3.055.988 4.445A1.5 1.5 0 006.327 21H17.673a1.5 1.5 0 00-.988-4.445C21.423 13.074 19.423 10.445 17.578 9.382A1.5 1.5 0 0016.821 6H12" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">Welcome Back</h1>
      <p class="text-slate-400 mt-2 text-sm">Sign in to continue your journey</p>
    </header>

    <!-- Login Form Card -->
    <div class="glass-card rounded-3xl p-8 shadow-2xl" style="animation: popIn 0.5s ease forwards;">

      <!-- Social Buttons (top) -->
      <div class="flex justify-center gap-3 mb-7">
        <button type="button" onclick="showToast('Google login coming soon', 'info')"
          class="group relative px-4 py-2.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 flex items-center gap-2 text-sm font-medium text-slate-300 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.29 23.24c.79-1.56 2.07-2.52 3.66-2.52 3.47 0 6.19 2.41 6.19 5.72C18.46 19.29 15.48 21.09 12 21.09c-3.48 0-6.5 2.39-6.5 5.72A8.18 8.18 0 002.03 20.3c2.4 1.31 4.69 2.52 6.19 2.52zm.92-14.6c0-2.78 1.92-5.25 4.38-5.25C6.04 8.05 8 9.87 8 12.38s1.96 4.33 4.38 4.33c2.46 0 4.74-2.12 4.74-4.87S15.16 6.07 12 6.07 7.96 6.07 4.38 6.07c-2.46 0-4.58 2.09-4.58 4.73z" />
          </svg>
          Google
        </button>

        <button type="button" onclick="showToast('GitHub login coming soon', 'info')"
          class="group relative px-4 py-2.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 flex items-center gap-2 text-sm font-medium text-slate-300 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2C6.48 2 2 6.48 2 12c0 3.51 1.35 6.79 3.56 9.31-.2.1-.48.28-.72.46C8.3 20.34 7 19 7 15s1.3-3.34 3.56-9.31c.2-.2.38-.42.55-.61C11.65 7.64 12 6.38 12 6c0-.68-.12-1.33-.37-2C19.62 7.64 21 9.3 21 15s-1.3 3.34-3.56 9.31A10.07 10.07 0 0022 12c0-5.52-4.48-10-10-10z" />
          </svg>
          GitHub
        </button>

        <button type="button" onclick="showToast('Microsoft login coming soon', 'info')"
          class="group relative px-4 py-2.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 flex items-center gap-2 text-sm font-medium text-slate-300 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.69 3.31c-.73.85-1.27 1.99-1.27 3.31s.54 2.46 1.27 3.31C9.07 9.07 10.11 10 11.56 10c1.28 0 2.33-.79 2.75-1.9A10.14 10.14 0 0017.53 3.31c0-1.32-.54-2.46-1.27-3.31zm2.84 5.31c-.7.9-1.25 2.04-1.25 3.3s.55 2.4 1.25 3.31C16.45 16.68 17.5 15.64 18 14.29c.05-.13.09-.27.11-.42A10.14 10.14 0 0021 6.69c0-1.31-.55-2.45-1.25-3.3z" />
          </svg>
          Microsoft
        </button>

        <button type="button" onclick="showToast('Apple login coming soon', 'info')"
          class="group relative px-4 py-2.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 flex items-center gap-2 text-sm font-medium text-slate-300 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.89 7c-.5.7-1.46 1.15-2.36 1.5A7.83 7.83 0 012 15a7.94 7.94 0 011.05 2.41C4.06 20.8 7.38 21 11 21c3.62 0 6.94-1.12 9.3 2.9l2.18 2.19A2.54 2.54 0 0022 17.33a12.74 12.74 0 00-1.61-3.7C18.38 12.12 15.06 9 11 9c-.4-2.11-1.56-3.93-3.81-3.93z" />
          </svg>
          Apple
        </button>
      </div>

      <h2 class="text-xl font-semibold text-white mb-1">Sign in</h2>
      <p class="text-slate-400 text-sm mb-8">Or continue with your email address</p>

      <!-- Form -->
      <form id="loginForm" novalidate class="space-y-5" onsubmit="handleLogin(event)">

        <!-- Email -->
        <div class="relative group">
          <label for="email" class="sr-only">Email Address</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 transition-colors duration-300 group-focus-within:text-indigo-400">
              📧
            </span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
              class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-600 focus:outline-none transition-all duration-300 input-glow"
            />
          </div>
          <p class="text-xs mt-2 text-red-400 hidden" id="emailError">Please enter a valid email</p>
        </div>

        <!-- Password -->
        <div class="relative group">
          <label for="password" class="sr-only">Password</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 transition-colors duration-300 group-focus-within:text-indigo-400">
              🔒
            </span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              class="w-full pl-12 pr-13 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-600 focus:outline-none transition-all duration-300 input-glow"
            />
            <button type="button" id="togglePassword" onclick="togglePassword()" class="eye-icon absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors duration-200 p-1 cursor-pointer">
              <svg id="eyeOn" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.94 17.94A10.07 10.07 0 0112 20c-6.53 0-12-5.47-12-12a10.07 10.07 0 017.94-7.94M12 3v1m6.36 3.36l-.707.707M6.34 5.64l-.707.707M12 21c7 0 11-8 11-11A9.87 9.87 0 0021 3h-2a9.85 9.85 0 01-5.64 5.64" />
              </svg>
              <svg id="eyeOff" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.94 17.94A10.07 10.07 0 0112 20c-6.53 0-12-5.47-12-12a10.07 10.07 0 017.94-7.94M12 3v1m6.36 3.36l-.707.707M6.34 5.64l-.707.707M12 21c7 0 11-8 11-11A9.87 9.87 0 0021 3h-2a9.85 9.85 0 01-5.64 5.64" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Password Strength -->
        <div class="hidden relative">
          <div class="flex justify-between mb-1 text-xs font-medium" id="strengthLabels">
            <span id="strengthText"></span>
          </div>
          <div class="h-1.5 rounded-full bg-white/10 overflow-hidden">
            <div id="strengthBar" class="strength-bar-fill h-full w-0" style="background: #ef4444;"></div>
          </div>
        </div>

        <!-- Options Row -->
        <div class="flex items-center justify-between pt-2">
          <label class="flex items-center gap-2 cursor-pointer text-sm">
            <input type="checkbox" id="rememberMe" class="mt-1 w-4 h-4 rounded border-white/20 bg-white/5 text-indigo-500 focus:ring-indigo-500/30 focus:border-indigo-500 cursor-pointer accent-indigo-500 transition-colors" />
            <span class="text-slate-400 hover:text-white transition-colors">Remember me</span>
          </label>
          <a href="#" class="text-sm font-medium text-indigo-400 hover:text-indigo-300 transition-colors underline decoration-indigo-400/50" onclick="event.preventDefault()">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginBtn" class="w-full py-4 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold tracking-tight transition-all duration-300 hover:shadow-lg hover:shadow-indigo-500/25 hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed"
          disabled="false">
          <span class="inline-flex items-center justify-center gap-2">
            <svg id="btnIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline transition-transform duration-500 transform origin-left" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.83 4l2.44 2.46c.97-.97 2.4-1.05 3.52-.07A9.57 9.57 0 0021 11v2a5.5 5.5 0 11-11 0v-2z" />
            </svg>
            <span id="btnText">Sign In</span>
          </div>
        </button>

        <!-- Divider -->
        <hr class="border-white/5 my-4">

        <!-- Alternative Email (if needed) -->
        <a href="#" onclick="showToast('Email verification sent!', 'success')" class="text-center text-sm text-slate-500 hover:text-white transition-colors flex items-center justify-center gap-2">
          Already have an account? <span>Sign up</span>
        </a>
      </form>

    </div>

  </main>

  <head>
